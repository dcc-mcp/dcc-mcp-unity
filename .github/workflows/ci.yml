name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release-please--branches--**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-core:
    name: Minimum dcc-mcp-core / Python 3.9
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install "dcc-mcp-core==0.19.90" -e ".[dev]"
      - run: python -m pytest

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Prepare pinned msvc-kit with existing Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-msvc-kit.ps1
      - run: python -m pytest
        env:
          # Compile the C# fixtures and inspect the runner's registered VS/SDK.
          # This does not install Unity or establish IL2CPP build acceptance.
          DCC_MCP_REQUIRE_WINDOWS_TOOLCHAIN: ${{ runner.os == 'Windows' && '1' || '' }}
          DCC_MCP_REQUIRE_SELF_MSVC_KIT: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Upload real msvc-kit consumer evidence
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: msvc-kit-contract-python-${{ matrix.python-version }}
          path: dist/toolchain-evidence/
          if-no-files-found: warn

  lint-build:
    name: Lint, skill contracts, and package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Install SOP plan and receipt round-trip smoke
        run: python -m pytest tests/test_install.py -k "dry_run or round_trip"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python tools/lint_skills.py
      - run: python -m build
      - run: python -m twine check dist/*
